<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jucas Passeios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="Desafio.css">
</head>

<body>

<header class="header">
  <div class="container header-content">
    <div class="logo">
      <img src="https://www.logogenio.pt/download/preview/medium/6916449">
      <span>Jucas Passeios</span>
    </div>

    <nav class="menu">
      <a href="#">Promoções</a>
      <a href="#">Eventos</a>
      <a href="#">Viagens</a>
      <a href="Hoteis.html">Hotéis</a>
    </nav>

    <div class="header-actions">
      <button class="btn-login">Login</button>
      <i class="fa-solid fa-bars menu-toggle"></i>
    </div>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="slider">
    <div class="slides">
      <img src="https://upload.wikimedia.org/wikipedia/commons/f/f6/Eiffel_tower_at_dawn_horizontal.jpg">
      <img src="https://i.pinimg.com/originals/6d/b7/66/6db766ff6f8b38113032addf84c48f5a.jpg">
      <img src="https://img.freepik.com/fotos-gratis/pico-da-montanha-iluminado-pelo-nascer-do-sol-laranja-gerado-pela-ia_188544-38724.jpg">
    </div>
  </div>
</section>

<!-- SEARCH -->
<section class="search-box">
  <div class="search-grid">
    <input type="text" placeholder="Origem">
    <input type="text" placeholder="Destino">
    <input type="date">
    <input type="date">

    <select>
      <option>1 Quarto</option>
      <option>2 Quartos</option>
      <option>3 Quartos</option>
    </select>

    <select>
      <option>1 Pessoa</option>
      <option>2 Pessoas</option>
      <option>3 Pessoas</option>
    </select>

    <button class="btn-search">Buscar</button>
  </div>
</section>

<!-- CARDS -->
<section class="cards-section container">
  <h2>Ofertas Imperdíveis</h2>

  <div class="cards-grid">
    <div class="card">
      <img src="Imagens/Balão.webp">
      <div class="card-body">
        <h4>Campos do Jordão</h4>
        <p>A partir de</p>
        <span>R$ 1.979,89</span>
      </div>
    </div>

    <div class="card">
      <img src="Imagens/chichen-itza.jpg">
      <div class="card-body">
        <h4>México</h4>
        <p>A partir de</p>
        <span>R$ 3.499,00</span>
      </div>
    </div>

    <div class="card">
      <img src="Imagens/Campos_do_Jordão.jpg">
      <div class="card-body">
        <h4>Serra</h4>
        <p>A partir de</p>
        <span>R$ 2.299,00</span>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <p>© 2024 - Jucas Passeios | Desenvolvido por João Lucas</p>
</footer>

<script src="Carrossel.js"></script>
</body>
</html>
