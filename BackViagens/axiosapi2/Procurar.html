<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procurar Viagem</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Axios -->
  <script src="https://unpkg.com/axios@0.21.4/dist/axios.min.js"></script>

  <!-- JS -->
  <script src="Procurar.js" defer></script>
</head>

<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Jucas Passeios</a>

      <div>
        <a href="Cadastro.html" class="btn btn-outline-light btn-sm me-2">Cadastrar</a>
        <a href="Atualizar.html" class="btn btn-outline-light btn-sm me-2">Atualizar</a>
        <a href="Delete.html" class="btn btn-outline-light btn-sm me-2">Deletar</a>
        <a href="index.html" class="btn btn-light btn-sm">Home</a>
      </div>
    </div>
  </nav>

  <!-- Conteúdo -->
  <div class="container mt-5">

    <div class="row justify-content-center">
      <div class="col-md-6">

        <!-- Card Busca -->
        <div class="card shadow mb-4">
          <div class="card-body">
            <h4 class="text-center mb-3">Procurar Viagem por ID</h4>

            <form id="formProcurar">
              <div class="mb-3">
                <label class="form-label">ID da viagem</label>
                <input type="number" id="id" name="id" class="form-control" required>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-warning">
                  Procurar
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Resultado -->
        <div id="resultado"></div>

      </div>
    </div>

  </div>

</body>
</html>
