<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deletar Viagem</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Axios -->
  <script src="https://unpkg.com/axios@0.21.4/dist/axios.min.js"></script>

  <!-- JS -->
  <script src="Delete.js" defer></script>
</head>

<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
      <a class="navbar-brand" href="index.html">Jucas Passeios</a>

      <div>
        <a href="Cadastro.html" class="btn btn-outline-light btn-sm me-2">Cadastrar</a>
        <a href="Procurar.html" class="btn btn-outline-light btn-sm me-2">Procurar</a>
        <a href="Atualizar.html" class="btn btn-outline-light btn-sm me-2">Atualizar</a>
        <a href="index.html" class="btn btn-light btn-sm">Home</a>
      </div>
    </div>
  </nav>

  <!-- Conteúdo -->
  <div class="container mt-5">

    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card shadow">
          <div class="card-body">

            <h4 class="text-center text-danger mb-4">Deletar Viagem</h4>

            <!-- Buscar ID -->
            <div class="mb-3">
              <label class="form-label">ID da Viagem</label>
              <div class="input-group">
                <input type="number" id="idBusca" class="form-control">
                <button class="btn btn-warning" id="btnBuscar">Buscar</button>
              </div>
            </div>

            <hr>

            <!-- Dados da viagem -->
            <div id="dadosViagem" class="mb-3"></div>

            <!-- Botão deletar -->
            <div class="d-grid">
              <button id="btnDeletar" class="btn btn-danger" disabled>
                Deletar Viagem
              </button>
            </div>

            <div id="mensagem" class="mt-3"></div>

          </div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
