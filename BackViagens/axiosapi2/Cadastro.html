<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Viagem</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Axios -->
  <script src="https://unpkg.com/axios@0.21.4/dist/axios.min.js"></script>

  <!-- JS -->
  <script src="main.js" defer></script>
</head>

<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Jucas Passeios</a>

      <div>
        <a href="Atualizar.html" class="btn btn-outline-light btn-sm me-2">Atualizar</a>
        <a href="Procurar.html" class="btn btn-outline-light btn-sm me-2">Procurar</a>
        <a href="Delete.html" class="btn btn-outline-light btn-sm me-2">Deletar</a>
        <a href="index.html" class="btn btn-light btn-sm">Home</a>
      </div>
    </div>
  </nav>

  <!-- Conteúdo -->
  <div class="container mt-5">

    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card shadow">
          <div class="card-body">

            <h3 class="text-center mb-4">Cadastrar Nova Viagem</h3>

            <form id="viagemForm">

              <div class="mb-3">
                <label class="form-label">Título</label>
                <input type="text" name="title" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Descrição</label>
                <textarea name="description" class="form-control" rows="3" required></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label">Preço</label>
                <input type="number" name="price" class="form-control" step="0.01" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Veículo</label>
                <input type="text" name="vehicle" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">URL da Imagem</label>
                <input type="url" name="image" class="form-control" required>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-success">
                  Cadastrar
                </button>
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
