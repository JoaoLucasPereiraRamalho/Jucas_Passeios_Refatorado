<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atualizar Viagem</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Axios -->
  <script src="https://unpkg.com/axios@0.21.4/dist/axios.min.js"></script>

  <!-- JS -->
  <script src="Atualizar.js" defer></script>
</head>

<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Jucas Passeios</a>

      <div>
        <a href="Cadastro.html" class="btn btn-outline-light btn-sm me-2">Cadastrar</a>
        <a href="Procurar.html" class="btn btn-outline-light btn-sm me-2">Procurar</a>
        <a href="Delete.html" class="btn btn-outline-light btn-sm me-2">Deletar</a>
        <a href="index.html" class="btn btn-light btn-sm">Home</a>
      </div>
    </div>
  </nav>

  <!-- Conteúdo -->
  <div class="container mt-5">

    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card shadow">
          <div class="card-body">

            <h4 class="text-center mb-4">Atualizar Viagem</h4>

            <!-- Buscar por ID -->
            <div class="mb-3">
              <label class="form-label">ID da Viagem</label>
              <div class="input-group">
                <input type="number" id="idBusca" class="form-control">
                <button class="btn btn-warning" id="btnBuscar">Buscar</button>
              </div>
            </div>

            <hr>

            <!-- Formulário -->
            <form id="formAtualiza">

              <input type="hidden" id="id">

              <div class="mb-3">
                <label class="form-label">Título</label>
                <input type="text" id="title" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Descrição</label>
                <textarea id="description" class="form-control" rows="3" required></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label">Preço</label>
                <input type="number" id="price" class="form-control" step="0.01" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Veículo</label>
                <input type="text" id="vehicle" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">URL da Imagem</label>
                <input type="url" id="image" class="form-control" required>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                  Atualizar
                </button>
              </div>

            </form>

            <div id="mensagem" class="mt-3"></div>

          </div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
